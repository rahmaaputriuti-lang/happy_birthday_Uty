<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Kucing malu-malu"><style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes floatUp{0%{transform:translateY(10px) scale(.5);opacity:0}22%{opacity:1}100%{transform:translateY(-32px) scale(1.05);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes twinkle{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.b{fill:#fff;stroke:#E4CDBB;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.e{fill:#4A3428}.sh{fill:#fff}.bl{fill:#FF9FB8;opacity:.7}
.ln{fill:none;stroke:#4A3428;stroke-width:2.6;stroke-linecap:round}
.cat{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 92%}
.eyes{animation:blink 5.4s infinite;transform-box:fill-box;transform-origin:50% 50%}
.fl{animation:floatUp 3s ease-out infinite;transform-box:fill-box}
.sw{animation:sway 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.tw{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style><rect width="200" height="200" rx="34" fill="#FFF3E6"/><circle cx="40" cy="44" r="15" fill="#FFD6E4" opacity=".5"/><circle cx="164" cy="152" r="21" fill="#FFE7C4" opacity=".5"/><g class="cat"><path d="M138 164c24 3 37-11 34-31" fill="none" stroke="#E4CDBB" stroke-width="15" stroke-linecap="round"/><path d="M138 164c24 3 37-11 34-31" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><ellipse class="b" cx="100" cy="153" rx="44" ry="32"/><ellipse class="b" cx="76" cy="178" rx="15" ry="9"/><ellipse class="b" cx="124" cy="178" rx="15" ry="9"/><path class="b" d="M58 70 49 25 93 47Z"/><path class="b" d="M142 70 151 25 107 47Z"/><path d="M65 62 60 37 83 50Z" fill="#FFC2D1"/><path d="M135 62 140 37 117 50Z" fill="#FFC2D1"/><circle class="b" cx="100" cy="100" r="53"/><path class="ln" d="M72 100q8-10 16 0"/><path class="ln" d="M112 100q8-10 16 0"/><ellipse class="bl" cx="62" cy="113" rx="14" ry="9" opacity=".85"/><ellipse class="bl" cx="138" cy="113" rx="14" ry="9" opacity=".85"/><path d="M95.4 108h9.2l-4.6 5.4z" fill="#FF8FAE"/><path class="ln" d="M94 118q6 5 12 0"/><ellipse class="b" cx="86" cy="136" rx="11" ry="8"/><ellipse class="b" cx="114" cy="136" rx="11" ry="8"/><g class="fl" style="animation-duration:3.1s;animation-delay:0s"><g transform="translate(38,82) scale(1)"><path d="M0 7C-9-1-12-5-12-10c0-4 3-7 7-7 2.5 0 4.2 1.3 5 3 .8-1.7 2.5-3 5-3 4 0 7 3 7 7 0 5-3 9-12 17z" fill="#FF7FA8"/></g></g><g class="fl" style="animation-duration:3.4s;animation-delay:1.2s"><g transform="translate(158,92) scale(0.8)"><path d="M0 7C-9-1-12-5-12-10c0-4 3-7 7-7 2.5 0 4.2 1.3 5 3 .8-1.7 2.5-3 5-3 4 0 7 3 7 7 0 5-3 9-12 17z" fill="#FFB0C9"/></g></g></g></svg>