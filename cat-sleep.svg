<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Kucing tidur nyenyak"><style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes wag{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(18deg)}}
@keyframes blink{0%,84%,100%{transform:scaleY(1)}91%{transform:scaleY(.05)}}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(40deg)}}
@keyframes tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes pulse{0%,100%{transform:scale(1)}45%{transform:scale(1.22)}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.93)}}
@keyframes pinchL{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
@keyframes pinchR{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes bulge{0%,100%{transform:scale(1,1)}50%{transform:scale(1.16,1.06)}}
@keyframes floatUp{0%{transform:translateY(14px) scale(.35);opacity:0}25%{opacity:1}100%{transform:translateY(-40px) scale(1.15);opacity:0}}
@keyframes rise{0%{transform:translateY(6px);opacity:0}20%{opacity:1}100%{transform:translateY(-52px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.55) rotate(0);opacity:.35}50%{transform:scale(1.25) rotate(35deg);opacity:1}}
.b{fill:#fff;stroke:#E7D2C0;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.e{fill:#483226}.sh{fill:#fff}
.bl{fill:#FF9BB8;opacity:.78}
.ln{fill:none;stroke:#483226;stroke-width:3.4;stroke-linecap:round}
.cat{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 94%}
.head{animation:tilt 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 96%}
.eyes{animation:blink 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.tail{animation:wag 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:6% 96%}
.pawW{animation:wave 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:14% 92%}
.body{animation:breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.heart{animation:pulse 1.25s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.face{animation:squish 1.45s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.pinL{animation:pinchL 1.45s ease-in-out infinite}
.pinR{animation:pinchR 1.45s ease-in-out infinite}
.chickL{animation:bulge 1.45s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 45%}
.chickR{animation:bulge 1.45s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 45%}
.fl{transform-box:fill-box}
.tw{animation:twinkle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style><rect width="220" height="220" rx="38" fill="#FFF4E9"/><circle cx="42" cy="46" r="17" fill="#FFD8E6" opacity=".55"/><circle cx="180" cy="168" r="24" fill="#FFEAC8" opacity=".55"/><g class="cat"><g class="tail"><path d="M150 180 C182 184 198 164 190 138" fill="none" stroke="#E7D2C0" stroke-width="17" stroke-linecap="round"/><path d="M150 180 C182 184 198 164 190 138" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g><g class="body"><ellipse class="b" cx="110" cy="170" rx="43" ry="30"/><ellipse class="b" cx="88" cy="193" rx="16" ry="9"/><ellipse class="b" cx="132" cy="193" rx="16" ry="9"/></g><g class="head"><path class="b" d="M60 68 52 24 98 46Z"/><path class="b" d="M160 68 168 24 122 46Z"/><path d="M68 60 63 36 88 50Z" fill="#FFC4D2"/><path d="M152 60 157 36 132 50Z" fill="#FFC4D2"/><ellipse class="b" cx="110" cy="98" rx="62" ry="54"/><path class="ln" d="M74 98q12 12 24 0" stroke-width="4.2"/><path class="ln" d="M122 98q12 12 24 0" stroke-width="4.2"/><ellipse class="bl" cx="66" cy="114" rx="15" ry="9"/><ellipse class="bl" cx="154" cy="114" rx="15" ry="9"/><ellipse cx="110" cy="120" rx="5.5" ry="4.5" fill="#FF8EAD"/></g><g class="fl" style="animation:rise 3.2s ease-out infinite;animation-delay:0s"><text x="170" y="106" font-family="Verdana,Geneva,sans-serif" font-size="26" font-weight="bold" fill="#B79AD6">z</text></g><g class="fl" style="animation:rise 3.2s ease-out infinite;animation-delay:1.2s"><text x="192" y="84" font-family="Verdana,Geneva,sans-serif" font-size="17" font-weight="bold" fill="#CDB8E4">z</text></g></g></svg>